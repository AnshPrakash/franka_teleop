[metadata]
name = franka_teleop
version = 0.0.0
description = Franka teleoperation + recorder (ROS 2 Humble)

[options]
packages = find:
install_requires =
    numpy
    hydra-core
    omegaconf
zip_safe = True

[options.packages.find]
where = .
exclude =
    tests

[options.entry_points]
console_scripts =
    oculus_transforms_vrpolicy = franka_teleop.oculus_transforms_vrpolicy:main
    teleop_quest = franka_teleop.teleop_recorder:main